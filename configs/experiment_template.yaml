# Experiment template. Copy and edit for a specific study.
# On EC2 (or locally, with `data/benchmarks/` provisioned), set data.root / data.benchmark
# to load real benchmark payloads. Verdicts remain synthetic until a real LLMJudgeAdapter
# is wired in -- see docs/baseline_adapters.md and TODO_IMPLEMENTATION.md.
experiment:
  n_judges: 7
  rules: [cmed, gmed, krum]
  margin: 0.2
  radius: 0.1
  correlation: 0.2
  embedding_dim: 8
  threshold: 0.5
  escalate_band: 0.05    # enable escalation band delta
  attack: collusion      # stress-test with adaptive collusion
  f: 2
  n_payloads: 1000
  unsafe_fraction: 0.5
  calibrate: true
  target_orr: 0.05
  seed: 0

# Consumed from here when running with real benchmarks. `data.benchmark` is either a
# subdirectory of data.root (e.g. data/benchmarks/<name>) or empty when data.root already
# points at the benchmark directory holding <split>.csv.
data:
  root: "data/benchmarks"     # e.g. /data/injecagent on EC2, or data/benchmarks locally
  benchmark: "formal"         # harmbench | advbench | dan | injecagent | formal | second_order | benign | benign_xstest
  split: test

# Judge backend. backend: synthetic (default, no LLM) or vllm (real judge on the GPU server).
# backbones: list one + set n_judges x times for a homogeneous committee, or several for RQ4
# diversity (assigned round-robin to judge slots). max_resident_engines: 1 runs one backbone
# session at a time so a diverse committee fits a single GPU. isolation: false is the RQ2
# un-isolated ablation. verdict_cache is shared across calibrate/evaluate/ablate to turn one
# verdict per (payload, judge).
judges:
  backend: vllm
  backbones: [meta-llama/Meta-Llama-3-8B-Instruct]
  isolation: true
  max_resident_engines: 0
  verdict_cache: "outputs/cache/verdicts.jsonl"
