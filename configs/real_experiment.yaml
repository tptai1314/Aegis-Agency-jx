# Real-data experiment configuration (GPU server).
#
# Loads REAL benchmark payloads from data/benchmarks/<benchmark>/test.csv and adjudicates
# them with REAL vLLM judges (meta-llama/Meta-Llama-3-8B-Instruct, temperature 0) instead of
# the synthetic verdict generator. Verdicts are cached deterministically per
# (model, payload_id, judge_id) in judges.verdict_cache, shared across
# calibrate/evaluate/ablate so each payload is prompted exactly once.
#
#   python scripts/run_experiment.py --config configs/real_experiment.yaml --stage calibrate --output outputs/real_vllm
#   python scripts/run_experiment.py --config configs/real_experiment.yaml --stage evaluate  --output outputs/real_vllm
#   python scripts/run_experiment.py --config configs/real_experiment.yaml --stage ablate    --output outputs/real_vllm
#
# On a machine without vLLM the judges raise a clear install error; locally, drop the
# `judges` section (or set backend: synthetic) to fall back to synthetic verdicts.
experiment:
  n_judges: 7
  rules: [cmed, gmed, krum]
  margin: 0.25
  radius: 0.08
  correlation: 0.1
  embedding_dim: 4
  threshold: 0.5
  escalate_band: 0.0
  attack: compromise
  f: 2
  n_payloads: 1000
  unsafe_fraction: 0.5
  calibrate: true
  target_orr: 0.05
  seed: 7

data:
  root: "data/benchmarks"
  benchmark: "formal"        # formal is class-balanced (700 unsafe / 700 benign)
  split: test

judges:
  backend: vllm
  backbones: [meta-llama/Meta-Llama-3-8B-Instruct]
  isolation: true             # RQ2 ablation: set false to measure the un-isolated pipeline
  max_resident_engines: 0     # 0 = unlimited; 1 = one backbone session at a time (diverse on 1 GPU)
  verdict_cache: "outputs/cache/real_vllm.jsonl"